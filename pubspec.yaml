name: masarifi
description: "مصاريفي — personal finance app for salaried people in Algeria."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_messaging: ^15.2.5
  google_sign_in: ^6.2.2

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1

  # UI / charts
  fl_chart: ^0.69.2

  # Reports & export
  excel: ^4.0.6
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^11.0.0

  # Utilities
  intl: any
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
