name: chehria
description: "الشهرية: مصاريف وديون بالدينار"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  google_sign_in: ^6.2.2
  firebase_crashlytics: ^4.3.10
  firebase_app_check: ^0.3.2+10

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1

  # UI / charts
  fl_chart: ^0.69.2

  # Reports & export
  excel: ^4.0.6
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^11.0.0

  # Utilities
  intl: any
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # In-memory Firestore for repository tests
  fake_cloud_firestore: ^3.1.0

  # App icons generated from assets/brand/ (dart run flutter_launcher_icons)
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path_android: assets/brand/icon.png
  image_path_ios: assets/brand/icon-ios.png
  min_sdk_android: 24
  adaptive_icon_background: "#00873D"
  adaptive_icon_foreground: assets/brand/adaptive-foreground.png
  adaptive_icon_monochrome: assets/brand/adaptive-monochrome.png

flutter:
  uses-material-design: true

  assets:
    # Arabic glyphs for the PDF export (SIL Open Font License, see OFL.txt).
    - assets/fonts/
